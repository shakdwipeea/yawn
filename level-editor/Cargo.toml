cargo-features = ["profile-rustflags"]

[package]
name = "level-editor"
description = "Level editor application using the renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "level-editor"
path = "src/main.rs"

[features]
default = []
atomics = []
bulk-memory = []

[profile.release]
opt-level = "z"
lto = true

[target.wasm32-unknown-unknown]
rustflags = [
    "-Clink-args=--shared-memory",
    "-Clink-args=--max-memory=1073741824",
    "-Clink-args=--import-memory",
    "-Clink-args=--export=__wasm_init_tls",
    "-Clink-args=--export=__tls_size",
    "-Clink-args=--export=__tls_align",
    "-Clink-args=--export=__tls_base",
]

[dependencies]
renderer = { path = "../renderer" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
ultraviolet = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smithay-client-toolkit = "0.20.0"
wayland-backend = { version = "0.3.14", features = ["client_system"] }
wayland-client = { version = "0.31.1", features = ["system"] }
# Native logger so `log::info!` from the renderer is visible without
# wiring up a custom logger; the WASM build uses `wasm_logger` instead.
env_logger = "0.11"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
